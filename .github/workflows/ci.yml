name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The three libraries, the web app and their tests need no MAUI workload.
      - run: dotnet restore tests/MauiWeather.Tests
      - run: dotnet format tests/MauiWeather.Tests --verify-no-changes --no-restore
      - run: dotnet format src/MauiWeather.Domain --verify-no-changes --no-restore
      - run: dotnet format src/MauiWeather.Data --verify-no-changes --no-restore
      - run: dotnet format src/MauiWeather.Presentation --verify-no-changes --no-restore
      - run: dotnet format src/MauiWeather.Web --verify-no-changes --no-restore
      # The .NET analyzers run as part of the build; any warning fails it
      # (see Directory.Build.props).
      - run: dotnet test tests/MauiWeather.Tests --no-restore

  build-web:
    name: Build web app
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet publish src/MauiWeather.Web -c Release -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: maui-weather-web
          path: publish/wwwroot
          retention-days: 14

  build-android:
    name: Analyze and build Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: dotnet workload install maui-android
      - run: dotnet restore src/MauiWeather
      - run: dotnet format src/MauiWeather --verify-no-changes --no-restore
      - run: dotnet build src/MauiWeather -f net10.0-android -c Debug --no-restore
      - uses: actions/upload-artifact@v7
        with:
          name: maui-weather-debug-apk
          path: src/MauiWeather/bin/Debug/net10.0-android/*-Signed.apk
          retention-days: 14
